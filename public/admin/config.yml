      - { label: Introduction text, name: intro, widget: markdown, required: false, buttons: [heading-two, heading-three, bold, italic, link, bulleted-list, numbered-list, quote], editor_components: [], hint: "Shown under the title (and on the cards). The line with a bubble comes right after it. You can use headings, bold, italic, links and lists." }
      - { label: Show the published date, name: showDate, widget: boolean, default: true, required: false, hint: "Switch on to show Published under the title." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true, default: "{{now}}", hint: "Pick a date even if you do not show it. Articles and stories are sorted by it, newest first." }
      - { label: Show the updated date, name: showUpdated, widget: boolean, default: true, required: false, hint: "Switch on to show Updated next to the published date. It only shows when a date is picked below." }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Pick it when you change the text later." }
      - label: Heading photo
        name: cover
        widget: object
        required: false
        collapsed: true
        hint: "Optional. One photo on the right of the heading, between the title and the line with a bubble. It also shows at the bottom of the cards, in search results and when someone shares the link. Visitors can click it to see it big with its own text."
        fields:
          - { label: Photo, name: image, widget: image, required: false, hint: "Resize it to about 1600 pixels wide before uploading. It is shown in the gallery shape (4 by 3); the big view shows the whole photo." }
          - { label: "What is in the photo (alt text)", name: alt, widget: string, required: false, hint: "Short and plain, for people who cannot see the photo and for search engines. If you leave it empty, the title is used." }
          - label: Source of the photo
            name: source
            widget: select
            required: false
            default: own
            options:
              - { label: "My photo (green)", value: own }
              - { label: "AI generated (blue)", value: ai }
              - { label: "External source (orange)", value: external }
            hint: "Shown as a coloured frame and label on the photo."
          - { label: "Credit or link (external photos)", name: credit, widget: string, required: false, hint: "Who made it, or a web address starting with https://. Shown under the photo." }
          - { label: Photo introduction, name: intro, widget: text, required: false, hint: "Optional. Shown in the big photo view, under the title." }
          - { label: Photo main text, name: body, widget: markdown, required: false, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [], hint: "Optional. Shown in the big photo view, under the line with a bubble." }
      - { label: Notice, name: notice, widget: select, default: none, options: [{ label: "None", value: none }, { label: "Coming soon", value: coming }, { label: "Nothing here yet", value: empty }], hint: "Coming soon or Nothing here yet shows a card under the line with a bubble and hides the Main text on the page (you can still edit it). None shows the Main text. To end a long text with a card instead, use Insert in the Main text." }
      - { label: Notice message, name: comingSoonMessage, widget: text, required: false, hint: "Optional. The sentence inside the notice card. Leave empty for the standard sentence." }
      - { label: Main text, name: body, widget: markdown, required: false, hint: "The story. Use Insert for Photo, Section break, Coming soon and Nothing here yet." }

  - name: gallery
    label: Gallery
    label_singular: Gallery entry
    folder: src/content/gallery
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: Descending }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description (for search engines), name: description, widget: text, required: false, hint: "Optional. The grey text Google shows. If you leave it empty, the Introduction text is used." }
      - { label: Introduction text, name: intro, widget: markdown, required: false, buttons: [heading-two, heading-three, bold, italic, link, bulleted-list, numbered-list, quote], editor_components: [], hint: "Shown under the title. The line with a bubble comes right after it. You can use headings, bold, italic, links and lists." }
      - { label: Show the published date, name: showDate, widget: boolean, default: true, required: false, hint: "Switch on to show Published under the title." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true, default: "{{now}}", hint: "Pick a date even if you do not show it. The Gallery is sorted by it, newest first." }
      - { label: Show the updated date, name: showUpdated, widget: boolean, default: true, required: false, hint: "Switch on to show Updated next to the published date. It only shows when a date is picked below." }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Pick it when you change the text later." }
      - label: Labels
        name: labels
        widget: relation
        collection: galleryLabels
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        multiple: true
        dropdown_threshold: 0
        required: false
        hint: "Pick one or more Gallery labels, or none (then the photo only shows under All). All photos in this entry share them. You can add a new label with Add Label."
      - label: Photos
        name: photos
        widget: list
        min: 1
        hint: "Add one or more photos. Resize them to about 1600 pixels wide before uploading."
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: "What is in the photo (alt text)", name: alt, widget: string, hint: "Required. Short and plain, for people who cannot see the photo and for search engines." }
          - label: Source of the photo
            name: source
            widget: select
            options:
              - { label: "My photo (green)", value: own }
              - { label: "AI generated (blue)", value: ai }
              - { label: "External source (orange)", value: external }
            hint: "Required. Shown as a coloured label on the photo."
          - { label: "Credit or link (external photos)", name: credit, widget: string, required: false, hint: "Who made it, or a web address starting with https://. Shown under the photo." }
      - { label: Main text, name: body, widget: markdown, required: false, hint: "The explanation. Shown on the right when someone clicks the photo, and under the photos on the photo's own page." }

  - name: notices
    label: Important notes
    label_singular: Note
    folder: src/content/notices
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: [Correction, Site update, Policy, Other], default: Other }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Text, name: body, widget: markdown, hint: "Shown in the Important notes panel on the home page. When you delete the last note, the panel disappears." }

  - name: labels
    label: Knowledge Center labels
    label_singular: Knowledge Center label
    description: "Labels for the articles. Each label has its own page, edited like the other pages. Do not mix them up with the Gallery labels (a separate list)."
