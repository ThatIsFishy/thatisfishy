      - { label: Colour, name: color, widget: color, default: "#1596e0", allowInput: true, hint: "Pick any colour." }
      - { label: Menu order, name: order, widget: number, value_type: int, default: 50, hint: "Lower numbers come first in the menu and on the chips." }
