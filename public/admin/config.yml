      - { label: Footer position, name: footerPosition, widget: number, value_type: int, default: 100, hint: "Used when the link shows in the footer. Lower numbers come first. Now: About 10, Contact 20, Rating System 30, Ground rules 40, Privacy 50. 100 puts it last." }
