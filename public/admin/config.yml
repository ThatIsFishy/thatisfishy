# Sveltia CMS settings. The repo line below points to your GitHub repository.
backend:
  name: github
  repo: ThatIsFishy/thatisfishy
  branch: main

site_url: https://thatisfishy.com
display_url: https://thatisfishy.com
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: guides
    label: Knowledge Center articles
    label_singular: Article
    folder: src/content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Labels
        name: labels
        widget: relation
        collection: labels
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        multiple: true
        required: false
        hint: "Pick one or more labels, or none (then the article only shows under All). You can also add a new label here with Add Label."
      - { label: Short description, name: description, widget: text, hint: "One or two sentences shown in the article list." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Fill it in when you change the article later. It shows as 'Updated' under the title." }
      - { label: Article text, name: body, widget: markdown }

  - name: journal
    label: Fishy Stories
    label_singular: Story
    folder: src/content/journal
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Fill it in when you change the article later. It shows as 'Updated' under the title." }
      - { label: Short description, name: description, widget: text, required: false }
      - { label: Story, name: body, widget: markdown }

  - name: gallery
    label: Gallery
    label_singular: Gallery entry
    folder: src/content/gallery
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{order}}. {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Fill it in when you change the article later. It shows as 'Updated' under the title." }
      - { label: Order number, name: order, widget: number, value_type: int, default: 100, hint: "1 comes first on the Gallery page. Same number = newest first." }
      - label: Photos
        name: photos
        widget: list
        min: 1
        hint: "Add one or more photos. Resize them to about 1600 pixels wide before uploading."
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: "What is in the photo (alt text)", name: alt, widget: string, hint: "Required. Short and plain, for people who cannot see the photo and for search engines." }
          - label: Source of the photo
            name: source
            widget: select
            options:
              - { label: "My photo (green)", value: own }
              - { label: "AI generated (blue)", value: ai }
              - { label: "External source (orange)", value: external }
            hint: "Required. Shown as a coloured label on the photo."
          - { label: "Credit or link (external photos)", name: credit, widget: string, required: false, hint: "Who made it, or a web address starting with https://. Shown under the photo." }
      - { label: Explanation, name: body, widget: markdown, hint: "Shown on the right when someone clicks the photo." }

  - name: notices
    label: Important notes
    label_singular: Note
    folder: src/content/notices
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: [Correction, Site update, Policy, Other], default: Other }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Text, name: body, widget: markdown, hint: "Shown in the Important notes panel on the home page. When you delete the last note, the panel disappears." }

  - name: labels
    label: Labels
    label_singular: Label
    folder: src/content/labels
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{order}}. {{name}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Colour, name: color, widget: color, default: "#1596e0", allowInput: true, hint: "Pick any colour. (Older labels may show the default here until you pick a colour and save.)" }
      - { label: Menu order, name: order, widget: number, value_type: int, default: 50, hint: "Lower numbers come first in the menu." }
      - { label: Short description, name: description, widget: text, required: false, hint: "Shown at the top of this label's page." }
      - { label: Message while there are no articles, name: emptyMessage, widget: text, required: false, hint: "Optional. Shown under \"Nothing here yet\" on this label's page until the first article has this label. Leave empty for the standard message." }

  - name: shops
    label: Shop Finder
    label_singular: Shop
    folder: src/content/shops
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{name}} ({{city}})"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: City, name: city, widget: string }
      - { label: What they sell, name: types, widget: select, multiple: true, options: [Fish, Plants, Shrimp, Saltwater, Equipment, Food] }
      - { label: Website, name: url, widget: string, required: false }
      - { label: My notes, name: note, widget: text, required: false }

  - name: pages
    label: Page texts
    label_singular: Page text
    folder: src/content/pages
    extension: md
    format: yaml-frontmatter
    create: false
    delete: false
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description (for search engines), name: description, widget: text, required: false }
      - { label: Text, name: body, widget: markdown }
