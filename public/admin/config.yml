# Sveltia CMS settings. The repo line below points to your GitHub repository.
backend:
  name: github
  repo: ThatIsFishy/thatisfishy
  branch: main

site_url: https://thatisfishy.com
display_url: https://thatisfishy.com
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: guides
    label: Knowledge Center articles
    label_singular: Article
    folder: src/content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description (for search engines), name: description, widget: text, required: false, hint: "Optional. The grey text Google shows. If you leave it empty, the Introduction text is used." }
      - { label: Introduction text, name: intro, widget: text, required: false, hint: "Shown under the title (and on the cards). The line with a bubble comes right after it." }
      - { label: Show the published date, name: showDate, widget: boolean, default: true, required: false, hint: "Switch on to show Published under the title." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true, default: "{{now}}", hint: "Pick a date even if you do not show it. Articles and stories are sorted by it, newest first." }
      - { label: Show the updated date, name: showUpdated, widget: boolean, default: true, required: false, hint: "Switch on to show Updated next to the published date. It only shows when a date is picked below." }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Pick it when you change the text later." }
      - label: Labels
        name: labels
        widget: relation
        collection: labels
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        multiple: true
        required: false
        hint: "Pick one or more labels, or none (then the article only shows under All). You can also add a new label here with Add Label."
      - { label: Notice, name: notice, widget: select, default: none, options: [{ label: "None", value: none }, { label: "Coming soon", value: coming }, { label: "Nothing here yet", value: empty }], hint: "Coming soon or Nothing here yet shows a card under the line with a bubble and hides the Main text on the page (you can still edit it). None shows the Main text. To end a long text with a card instead, use Insert in the Main text." }
      - { label: Notice message, name: comingSoonMessage, widget: text, required: false, hint: "Optional. The sentence inside the notice card. Leave empty for the standard sentence." }
      - { label: Main text, name: body, widget: markdown, required: false, hint: "The article. Use Insert for Photo, Section break, Coming soon and Nothing here yet." }

  - name: journal
    label: Fishy Stories
    label_singular: Story
    folder: src/content/journal
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description (for search engines), name: description, widget: text, required: false, hint: "Optional. The grey text Google shows. If you leave it empty, the Introduction text is used." }
      - { label: Introduction text, name: intro, widget: text, required: false, hint: "Shown under the title (and on the cards). The line with a bubble comes right after it." }
      - { label: Show the published date, name: showDate, widget: boolean, default: true, required: false, hint: "Switch on to show Published under the title." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true, default: "{{now}}", hint: "Pick a date even if you do not show it. Articles and stories are sorted by it, newest first." }
      - { label: Show the updated date, name: showUpdated, widget: boolean, default: true, required: false, hint: "Switch on to show Updated next to the published date. It only shows when a date is picked below." }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Pick it when you change the text later." }
      - { label: Notice, name: notice, widget: select, default: none, options: [{ label: "None", value: none }, { label: "Coming soon", value: coming }, { label: "Nothing here yet", value: empty }], hint: "Coming soon or Nothing here yet shows a card under the line with a bubble and hides the Main text on the page (you can still edit it). None shows the Main text. To end a long text with a card instead, use Insert in the Main text." }
      - { label: Notice message, name: comingSoonMessage, widget: text, required: false, hint: "Optional. The sentence inside the notice card. Leave empty for the standard sentence." }
      - { label: Main text, name: body, widget: markdown, required: false, hint: "The story. Use Insert for Photo, Section break, Coming soon and Nothing here yet." }

  - name: gallery
    label: Gallery
    label_singular: Gallery entry
    folder: src/content/gallery
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{order}}. {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Fill it in when you change the article later. It shows as 'Updated' under the title." }
      - { label: Order number, name: order, widget: number, value_type: int, default: 100, hint: "1 comes first on the Gallery page. Same number = newest first." }
      - label: Photos
        name: photos
        widget: list
        min: 1
        hint: "Add one or more photos. Resize them to about 1600 pixels wide before uploading."
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: "What is in the photo (alt text)", name: alt, widget: string, hint: "Required. Short and plain, for people who cannot see the photo and for search engines." }
          - label: Source of the photo
            name: source
            widget: select
            options:
              - { label: "My photo (green)", value: own }
              - { label: "AI generated (blue)", value: ai }
              - { label: "External source (orange)", value: external }
            hint: "Required. Shown as a coloured label on the photo."
          - { label: "Credit or link (external photos)", name: credit, widget: string, required: false, hint: "Who made it, or a web address starting with https://. Shown under the photo." }
      - { label: Explanation, name: body, widget: markdown, hint: "Shown on the right when someone clicks the photo." }

  - name: notices
    label: Important notes
    label_singular: Note
    folder: src/content/notices
    extension: md
    format: yaml-frontmatter
    create: true
    summary: "{{date}} {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: [Correction, Site update, Policy, Other], default: Other }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Text, name: body, widget: markdown, hint: "Shown in the Important notes panel on the home page. When you delete the last note, the panel disappears." }

  - name: labels
    label: Labels
    label_singular: Label
    folder: src/content/labels
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{order}}. {{name}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Colour, name: color, widget: color, default: "#1596e0", allowInput: true, hint: "Pick any colour. (Older labels may show the default here until you pick a colour and save.)" }
      - { label: Menu order, name: order, widget: number, value_type: int, default: 50, hint: "Lower numbers come first in the menu." }
      - { label: Short description, name: description, widget: text, required: false, hint: "Shown at the top of this label's page." }
      - { label: Message while there are no articles, name: emptyMessage, widget: text, required: false, hint: "Optional. Shown under \"Nothing here yet\" on this label's page until the first article has this label. Leave empty for the standard message." }

  - name: shops
    label: Shop Finder
    label_singular: Shop
    folder: src/content/shops
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{name}} ({{city}})"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: City, name: city, widget: string }
      - { label: What they sell, name: types, widget: select, multiple: true, options: [Fish, Plants, Shrimp, Saltwater, Equipment, Food] }
      - { label: Website, name: url, widget: string, required: false }
      - { label: My notes, name: note, widget: text, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    description: "All pages of the site. Menu and Position decide where the link shows. Do not delete the built-in pages (Home, Knowledge Center, Fishy Stories, Gallery, Shop Finder, Contact, Rating System, About, Ground rules, Privacy)."
    folder: src/content/pages
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "Also the name of the link in the header or footer." }
      - { label: Where to show the link, name: menu, widget: select, default: none, options: [{ label: "Nowhere (only reachable by a link)", value: none }, { label: "Header menu", value: header }, { label: "Footer", value: footer }, { label: "Header and footer", value: both }], hint: "Choose Header and footer to show it in both: then fill in both position numbers. Home is always first in the header and ignores this." }
      - { label: Header position, name: position, widget: number, value_type: int, default: 100, hint: "Used when the link shows in the header. Lower numbers come first. Now: Knowledge Center 20, Fishy Stories 30, Gallery 40, Shop Finder 50, About 60. 100 puts it last." }
      - { label: Footer position, name: footerPosition, widget: number, value_type: int, default: 100, hint: "Used when the link shows in the footer. Lower numbers come first. Now: About 10, Contact 20, Rating System 30, Ground rules 40, Privacy 50. 100 puts it last." }
      - { label: Short description (for search engines), name: description, widget: text, required: false, hint: "Optional. The grey text Google shows. If you leave it empty, the Introduction text is used." }
      - { label: Introduction text, name: intro, widget: text, required: false, hint: "Shown under the title (and on the cards). The line with a bubble comes right after it." }
      - { label: Show the published date, name: showDate, widget: boolean, default: false, required: false, hint: "Switch on to show Published under the title." }
      - { label: Date published, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true, default: "{{now}}", hint: "Pick a date even if you do not show it. Articles and stories are sorted by it, newest first." }
      - { label: Show the updated date, name: showUpdated, widget: boolean, default: true, required: false, hint: "Switch on to show Updated next to the published date. It only shows when a date is picked below." }
      - { label: Date updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Optional. Pick it when you change the text later." }
      - { label: Notice, name: notice, widget: select, default: none, options: [{ label: "None", value: none }, { label: "Coming soon", value: coming }, { label: "Nothing here yet", value: empty }], hint: "Coming soon or Nothing here yet shows a card under the line with a bubble and hides the Main text on the page (you can still edit it). None shows the Main text. To end a long text with a card instead, use Insert in the Main text." }
      - { label: Notice message, name: comingSoonMessage, widget: text, required: false, hint: "Optional. The sentence inside the notice card. Leave empty for the standard sentence." }
      - { label: Main text, name: body, widget: markdown, required: false, hint: "The main text of the page, between the line with a bubble and the footer. Use Insert for Photo, Section break, Coming soon and Nothing here yet." }
