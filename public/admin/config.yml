  - name: shops
    label: Shop Finder
    label_singular: Shop
    folder: src/content/shops
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{name}} ({{city}})"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: City, name: city, widget: string }
      - { label: What they sell, name: types, widget: select, multiple: true, options: [Fish, Plants, Shrimp, Saltwater, Equipment, Food] }
      - { label: Website, name: url, widget: string, required: false }
      - { label: My notes, name: note, widget: text, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    description: "All pages of the site. Menu and Position decide where the link shows. Do not delete the built-in pages (Home, Knowledge Center, Fishy Stories, Gallery, Shop Finder, Contact, Rating System, About, Ground rules, Privacy)."
